_format_version: "3.0"

services:
  - name: user-service
    url: http://user-service:8080
    plugins:
      - name: key-auth  # Add authentication
        config:
          key_names:
            - apikey
          hide_credentials: true  # Remove apikey header before forwarding to service
     
    routes:
      - name: users-routes
        paths:
          - /api/users
        strip_path: false
      - name: friend-requests-routes
        paths:
          - /api/friend-requests
        strip_path: false
      - name: friends-routes
        paths:
          - /api/friends
        strip_path: false

  - name: auth-service
    url: http://auth-service:3000
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:8080"  # Add frontend origins
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          credentials: true
      - name: rate-limiting
        config:
          minute: 30
          policy: local
    routes:
      - name: auth-login
        paths:
          - /api/auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-register
        paths:
          - /api/auth/register
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-refresh
        paths:
          - /api/auth/refresh
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-logout
        paths:
          - /api/auth/logout
        methods:
          - POST
          - OPTIONS
        strip_path: false
      - name: auth-health
        paths:
          - /api/v1/health
        methods:
          - GET
          - OPTIONS
        strip_path: false

# Define consumers (users who can access the services)
consumers:
  - username: mary_user
    keyauth_credentials:
      - key: mary-secret-key-2024
  - username: john_user
    keyauth_credentials:
      - key: john-secret-key-2024
  - username: test_user
    keyauth_credentials:
      - key: test123